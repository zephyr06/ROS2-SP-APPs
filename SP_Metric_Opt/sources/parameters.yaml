%YAML:1.0
# the time limit to run optimization for one time
TIME_LIMIT: 10 # seconds

# must be no less than 1, granularity balences accuracy and speed;
Granularity: 10
Layer_Node_During_Incremental_Optimization: 2

# P24 periodic reoptimization: every ReoptimizationPeriod-th interval, the
# TL search re-runs from scratch (compare-and-keep) instead of warm-starting
# from the incumbent, bounding priority drift over a long sim. Positive-only
# (min 1); a period larger than the interval count effectively skips reopt for
# that run.
#
# Trial-and-error walk: PerformCoordinateDescentForTaskConfigOpt steps outward
# from each task's baseline TL across the FULL per-task option set and stops
# after `patience` consecutive non-improving SP evals. The walk is not radius-
# capped — a tie-break or strictly-better option beyond the old radius wall is
# reachable — and usually stops well before the option-set boundary, so the
# average eval count per task is far below the set size.
#
# `patience` is tunable per-path: incremental warm-starts the PA search from
# the incumbent, so SP-vs-TL is effectively unimodal and patience=0 (strict)
# is safe and cheapest; reopt re-searches priorities from scratch per candidate,
# so SP-vs-TL can be non-unimodal at high utilization and patience=1 tolerates
# a single dip so a strictly-better option further out is not missed. Lower to
# shorten the walk (cheaper, may miss a dip-hidden better option); raise to
# search further (costlier, more thorough).
ReoptimizationPeriod: 10
IncrementalTimeLimitSearchPatience: 0
ReoptimizationTimeLimitSearchPatience: 1

# simulation export granularity controls:
# 0: interval SP metrics only (smallest disk usage)
# 1: + per-task miss-rate summary
# 2: + per-task aggregate statistics per sampled interval
# 3: + full per-job response-time traces (largest disk usage; backward-compatible default)
EXPORT_DETAIL_LEVEL: 0

# Time-based sampling for interval metrics. 0 = no sampling (output every interval).
# N > 0 = output only intervals whose start time (in seconds) is a multiple of N.
METRIC_SAMPLE_INTERVAL_SECONDS: 0

# ************** for debug purposes
debugMode: 1
printRTA: 0


